name: RetroPlay TV

# Builds the Android TV / Google TV app (tv/android), publishes it as the "tv-latest" release
# (the site's /tv address points there) and runs it on an Android TV emulator against the
# deploy of the same commit (tv/ci/tv-check.mjs).

# Runs when the TV app or this workflow changes, or by hand; the web side's TV mode is covered by
# the browser E2E (TV scenario) on every change. Only main publishes the APK; a branch build opens
# its pull request's deploy preview and is checked on the emulators there.
on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    paths:
      - "tv/**"
      - ".github/workflows/tv.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build the TV app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.site.outputs.url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Which site the app opens
        id: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # main: the live site. A branch: the deploy preview of its open pull request.
          URL=https://retroteo1.netlify.app/
          if [ "$GITHUB_REF_NAME" != main ]; then
            PR=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$GITHUB_REPOSITORY_OWNER:$GITHUB_REF_NAME" --jq '.[0].number // empty' || true)
            if [ -n "$PR" ]; then URL="https://deploy-preview-$PR--retroteo1.netlify.app/"
            else echo "::warning title=TV site::No open pull request for $GITHUB_REF_NAME: this build opens the live site."; fi
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "RETROPLAY_URL=$URL" >> "$GITHUB_ENV"
          echo "::notice title=TV site::$URL"
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"
      - name: Set up Python (the signing key from a phrase)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the phrase-derived key is the same on every run
        run: |
          pip install --quiet "cryptography==44.0.2"
          # A test phrase (not a secret) whose certificate is known: the derivation must never change,
          # or the TV app would stop installing over itself.
          FP=$(TV_SIGNING_SEED="test phrase only for local checks 0123456789" TV_KEYSTORE_PASSWORD=x python3 tv/ci/seed-keystore.py "$RUNNER_TEMP/test.p12")
          [ "$FP" = 3523995f950e5d39d25e62c69a5e89391d542f8c381c02ce2e61b20d9aa8fdf8 ] || { echo "::error title=TV signing::the phrase-derived certificate changed ($FP)"; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/test.p12" -storetype pkcs12 -storepass x | grep -q '^retroplay-tv,' || { echo "::error title=TV signing::alias retroplay-tv missing"; exit 1; }
          rm -f "$RUNNER_TEMP/test.p12"
      - name: Prepare the signing key
        env:
          TV_SIGNING_SEED: ${{ secrets.TV_SIGNING_SEED }}
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_SECRET_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
        run: |
          # Never in the repository. With the TV_SIGNING_SEED secret (a phrase: tv/ci/seed-keystore.py
          # derives the same key from it every time) or the TV_KEYSTORE_BASE64 / TV_KEYSTORE_PASSWORD
          # secrets every build has the same key (updates install over the app and keep its data);
          # without them this run makes its own key, and the published APK is replaced only when
          # tv/android changes.
          KEY="$RUNNER_TEMP/retroplay-tv.p12"
          if [ -n "$TV_KEYSTORE_BASE64" ] && [ -n "$TV_KEYSTORE_SECRET_PASSWORD" ]; then
            echo "$TV_KEYSTORE_BASE64" | base64 -d > "$KEY"
            PASS="$TV_KEYSTORE_SECRET_PASSWORD"
            echo "TV_SIGNING=stable" >> "$GITHUB_ENV"
          elif [ -n "$TV_SIGNING_SEED" ]; then
            PASS=$(openssl rand -hex 16)
            echo "::add-mask::$PASS"
            FP=$(TV_KEYSTORE_PASSWORD="$PASS" python3 tv/ci/seed-keystore.py "$KEY") || { echo "::error title=TV signing::TV_SIGNING_SEED is shorter than 24 characters or unusable"; exit 1; }
            echo "TV_SIGNING=stable" >> "$GITHUB_ENV"
            echo "::notice title=TV signing::Permanent key from TV_SIGNING_SEED · certificate SHA-256 ${FP:0:16}…"
          else
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$KEY" -storetype pkcs12 -alias retroplay-tv -keyalg RSA -keysize 3072 -validity 36500 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=RetroPlay TV, O=RetroPlay" >/dev/null 2>&1
            echo "TV_SIGNING=run" >> "$GITHUB_ENV"
            echo "::warning title=TV signing::No TV_KEYSTORE_* secrets: this build is signed with a key made for this run (see tv/README.md)."
          fi
          echo "::add-mask::$PASS"
          { echo "TV_KEYSTORE_FILE=$KEY"; echo "TV_KEYSTORE_PASSWORD=$PASS"; echo "TV_KEY_ALIAS=retroplay-tv"; } >> "$GITHUB_ENV"
      - name: Unit tests (display modes, sites)
        run: |
          set -o pipefail
          gradle -p tv/android testReleaseUnitTest --no-daemon --console=plain 2>&1 | tee test.log
      - name: Build the APK
        run: |
          set -o pipefail
          gradle -p tv/android assembleRelease --no-daemon --console=plain -PversionCode=${{ github.run_number }} -PretroplayUrl="$RETROPLAY_URL" 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          cat test.log build.log 2>/dev/null | grep -nE "error:|e: |What went wrong|FAILURE|FAILED|Could not|Execution failed|\.java:[0-9]+|Test.*>" | head -40 | while IFS= read -r line; do echo "::error title=TV build::$line"; done
      - name: Check the APK
        run: |
          APK=tv/android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -2
          "$BT/aapt" dump badging "$APK" | grep -E "^package:|leanback-launchable|application: label|sdkVersion|targetSdkVersion" | while IFS= read -r line; do echo "::notice title=TV apk::$line"; done
          cp "$APK" RetroPlayTV.apk
          echo "::notice title=TV apk::$(du -h RetroPlayTV.apk | cut -f1) · sha256 $(sha256sum RetroPlayTV.apk | cut -c1-16) · opens $RETROPLAY_URL"
      - name: Keep the APK
        uses: actions/upload-artifact@v6
        with:
          name: RetroPlayTV
          path: RetroPlayTV.apk
      - name: Publish a pull request's build as tv-test
        if: github.ref_name != 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && contains(env.RETROPLAY_URL, 'deploy-preview-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For trying a change of the app itself on the TV before it goes live: the site's /tv-test
          # address points here (Downloader). It opens the pull request's deploy preview; signed like
          # tv-latest once the permanent key exists, so tv-latest installs over it later.
          NOTES="RetroPlay TV 1.2.${{ github.run_number }} (deneme) · ${GITHUB_REF_NAME} · ${GITHUB_SHA::7} · imza $TV_SIGNING · açtığı site: $RETROPLAY_URL. Canlı sürüm değil: TV'de Downloader'a sitenin /tv-test adresini yaz."
          if gh release view tv-test >/dev/null 2>&1; then gh release edit tv-test --notes "$NOTES"
          else gh release create tv-test --prerelease --title "RetroPlay TV (deneme)" --notes "$NOTES" --target "$GITHUB_SHA"; fi
          gh release upload tv-test RetroPlayTV.apk --clobber
          echo "::notice title=TV test release::tv-test = $GITHUB_REF_NAME (${GITHUB_SHA::7}), signing $TV_SIGNING, opens $RETROPLAY_URL"
      - name: Publish as tv-latest
        if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The app's own code (and the address it opens: preview or main) decides when a new APK is
          # published: a site change reaches the TV without one, and an APK signed with another key
          # would not install over the old one.
          # Exception: once the TV_KEYSTORE_* secrets exist, an APK signed for one run is replaced
          # by the permanently signed one (a single reinstall); a permanent one is never replaced
          # by a per-run one.
          SOURCE=$(git ls-files -s tv/android | sha256sum | cut -c1-16)
          NOTES="RetroPlay TV 1.2.${{ github.run_number }} · ${GITHUB_SHA::7} · kaynak $SOURCE · imza $TV_SIGNING · açtığı site: $RETROPLAY_URL. Kurulum: TV'de Downloader uygulamasına sitenin /tv adresini yaz (ayrıntı: tv/README.md)."
          if gh release view tv-latest >/dev/null 2>&1; then
            BODY=$(gh release view tv-latest --json body -q .body)
            HAS_APK=$(gh release view tv-latest --json assets -q '.assets[].name' | grep -cx RetroPlayTV.apk || true)
            if [ "$TV_SIGNING" = run ] && echo "$BODY" | grep -q "imza stable"; then
              echo "::warning title=TV release::tv-latest is signed with the permanent key and this build is not (TV_KEYSTORE_* secrets missing); not replaced."
              exit 0
            fi
            if echo "$BODY" | grep -q "kaynak $SOURCE" && echo "$BODY" | grep -qF "açtığı site: $RETROPLAY_URL." && [ "$HAS_APK" = 1 ] && ! { [ "$TV_SIGNING" = stable ] && echo "$BODY" | grep -q "imza run"; }; then
              echo "::notice title=TV release::The app's code did not change; tv-latest keeps its APK."
              exit 0
            fi
            gh release edit tv-latest --notes "$NOTES"
          else
            gh release create tv-latest --prerelease --title "RetroPlay TV" --notes "$NOTES" --target "$GITHUB_SHA"
          fi
          gh release upload tv-latest RetroPlayTV.apk --clobber
          echo "::notice title=TV release::Published RetroPlay TV 1.2.${{ github.run_number }} (source $SOURCE)."

  emulator:
    name: Run on an Android TV emulator
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RETROPLAY_URL: ${{ needs.apk.outputs.url }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: google-tv
            api: 34
          - target: android-tv
            api: 33
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install the checker (Playwright, Android support only)
        working-directory: e2e
        run: npm install --no-audit --no-fund
      - name: Get the APK
        uses: actions/download-artifact@v7
        with:
          name: RetroPlayTV
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Wait for the deploy of this commit
        run: bash tv/ci/wait-deploy.sh "$RETROPLAY_URL" "$GITHUB_SHA"
      - name: Run the TV app on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86
          profile: tv_1080p
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: node tv/ci/tv-check.mjs RetroPlayTV.apk
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tv-ci-${{ matrix.target }}-${{ matrix.api }}
          path: tv-ci/
      - name: Attach the screenshots to tv-latest
        if: always() && github.ref_name == 'main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d tv-ci ] || exit 0
          cd tv-ci
          for f in *; do mv "$f" "ci-${{ matrix.target }}-${{ matrix.api }}-$f"; done
          gh release upload tv-latest ci-* --clobber || true
