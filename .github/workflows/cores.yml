name: RetroPlay cores

# Builds cores that RetroPlay serves in addition to the EmulatorJS 4.2.3 packages, from pinned
# sources with the toolchain the 4.2.3 cores were built with (EmulatorJS/build at 2025-06,
# emsdk 3.1.74, EmulatorJS/RetroArch "next" as of the 4.2.3 core build on 2025-06-14), so the
# runtime, its API and RetroPlay's patches work with them unchanged. Each build is published as a
# release; scripts/emulatorjs-runtime.mjs pins the files it uses by sha512.
#
#   mame2003_plus_next: libretro/mame2003-plus-libretro (2026), for the drivers whose 2025 build
#   was too slow or silent (Namco System 11/12: Tekken 1-3, Tekken Tag, Soul Edge, Soul Calibur …).

on:
  push:
    branches:
      - "fix/**"
    paths:
      - ".github/workflows/cores.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cores-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: "3.1.74"
  RETROARCH_REPO: https://github.com/EmulatorJS/RetroArch.git
  RETROARCH_COMMIT: 6dd4353937ef48b6ec0bfbdbb15d1c5992d86927
  MAME2003_PLUS_REPO: https://github.com/libretro/mame2003-plus-libretro.git
  MAME2003_PLUS_COMMIT: 64b3c38ac6dae0fb513e6b881fb3bfc31fca54c4

jobs:
  mame2003_plus_next:
    name: MAME 2003-Plus (2026) · ${{ matrix.opt }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # O2: the core's release flags. simd: the PSX GPU's NEON span code (psx_vidhrdw.c) compiled
        # to WebAssembly SIMD (emscripten -mfpu=neon translates the NEON intrinsics); simdall: also
        # -msimd128 for the whole core; verify: simd with the GPU's own check that every SIMD span
        # equals the table path (PSX_TEXSPAN_VERIFY, measurement only); *prof: function names kept.
        # inl: the CPU interpreter's INLINE helpers forced inline (psx_cpu.c); cpuo3: psx_cpu.c and
        # psx_vidhrdw.c at -O3; inlo3: both.
        opt: [inl, cpuo3, inlo3]
    steps:
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full >/dev/null
      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: emsdk
          key: emsdk-${{ env.EMSDK_VERSION }}
      - name: emsdk ${{ env.EMSDK_VERSION }}
        run: |
          if [ ! -x emsdk/emsdk ]; then git clone -q --depth 1 https://github.com/emscripten-core/emsdk.git emsdk; fi
          ./emsdk/emsdk install "$EMSDK_VERSION" >/dev/null
          ./emsdk/emsdk activate "$EMSDK_VERSION" >/dev/null
      - name: Sources
        run: |
          fetch() { mkdir -p "$1" && git -C "$1" init -q && git -C "$1" fetch -q --depth 1 "$2" "$3" && git -C "$1" checkout -q FETCH_HEAD; echo "$1 $(git -C "$1" rev-parse HEAD)"; }
          fetch RetroArch "$RETROARCH_REPO" "$RETROARCH_COMMIT"
          fetch core "$MAME2003_PLUS_REPO" "$MAME2003_PLUS_COMMIT"
      - name: Build the core (${{ matrix.opt }})
        working-directory: core
        run: |
          source ../emsdk/emsdk_env.sh >/dev/null
          OPT="${{ matrix.opt }}"
          case "$OPT" in O3) sed -i 's/CFLAGS += -O2 -DNDEBUG/CFLAGS += -O3 -DNDEBUG/' Makefile; grep -q -- '-O3 -DNDEBUG' Makefile;; esac
          case "$OPT" in simdall) sed -i 's/CFLAGS += -O2 -DNDEBUG/CFLAGS += -O2 -DNDEBUG -msimd128/' Makefile; grep -q -- '-DNDEBUG -msimd128' Makefile;; esac
          # NEON only where the core has NEON code written for it: libretro-common's NEON paths
          # call ARM assembly that a WebAssembly build does not have.
          case "$OPT" in simd*|verify*) printf '\nsrc/vidhrdw/psx_vidhrdw.o: CFLAGS += -msimd128 -mfpu=neon\n' >> Makefile;; esac
          case "$OPT" in inl*) printf '\nsrc/cpu/mips/psx_cpu.o: CFLAGS += "-DINLINE=inline __attribute__((always_inline))"\n' >> Makefile;; esac
          case "$OPT" in cpuo3|inlo3) printf '\nsrc/cpu/mips/psx_cpu.o: CFLAGS += -O3\nsrc/vidhrdw/psx_vidhrdw.o: CFLAGS += -O3\n' >> Makefile;; esac
          case "$OPT" in verify*)
            printf 'src/vidhrdw/psx_vidhrdw.o: CFLAGS += -DPSX_TEXSPAN_VERIFY\n' >> Makefile
            # report progress in the browser console (the check itself exits on the first mismatch)
            sed -i 's/^\tpsx_texspan_checked++;$/\tif( ( ++psx_texspan_checked % 20000 ) == 0 ) fprintf( stderr, "TEXSPAN verified %lu spans\\n", psx_texspan_checked );/' src/vidhrdw/psx_vidhrdw.c
            grep -n 'TEXSPAN verified' src/vidhrdw/psx_vidhrdw.c;;
          esac
          tail -n 3 Makefile
          set -o pipefail
          emmake make -j"$(nproc)" platform=emscripten 2>&1 | tail -n 25
          ls -la *.bc
      - name: Link with RetroArch (WebGL 2 and WebGL 1 builds)
        working-directory: RetroArch/emulatorjs
        run: |
          source ../../emsdk/emsdk_env.sh >/dev/null
          set -o pipefail
          case "${{ matrix.opt }}" in *prof) sed -i 's/^   LDFLAGS += -O3$/   LDFLAGS += -O3 --profiling-funcs/' ../Makefile.emulatorjs; grep -q -- '--profiling-funcs' ../Makefile.emulatorjs;; esac
          cp ../../core/mame2003_plus_libretro_emscripten.bc .
          emmake ./build-emulatorjs.sh --clean 2>&1 | tail -n 15
          cp ../../core/mame2003_plus_libretro_emscripten.bc .
          emmake ./build-emulatorjs.sh --clean --legacy 2>&1 | tail -n 15
          ls -la ../../EmulatorJS/data/cores/
      - name: Pack
        run: |
          OUT="out/${{ matrix.opt }}"; mkdir -p "$OUT"
          START=$(date -u -Is)
          printf '{"name":"mame2003_plus_next","extensions":["zip"],"options":{},"save":false,"license":"LICENSE.md","repo":"%s","commit":"%s","build":"%s"}' "$MAME2003_PLUS_REPO" "$MAME2003_PLUS_COMMIT" "${{ matrix.opt }}" > core.json
          printf '{\n    "minimumEJSVersion": "4.2.2",\n    "version": "2.0.2"\n}\n' > build.json
          cp core/LICENSE.md license.txt
          for variant in "" "-legacy"; do
            cp "EmulatorJS/data/cores/mame2003_plus${variant}-wasm.data" "$OUT/mame2003_plus_next${variant}-wasm.data"
            7z a -t7z "$OUT/mame2003_plus_next${variant}-wasm.data" core.json license.txt build.json >/dev/null
          done
          printf '{ "core": "mame2003_plus_next", "buildStart": "%s", "buildEnd": "%s", "options": {}, "source": "%s@%s", "retroarch": "%s", "emsdk": "%s", "opt": "%s" }\n' "$START" "$(date -u -Is)" "$MAME2003_PLUS_REPO" "$MAME2003_PLUS_COMMIT" "$RETROARCH_COMMIT" "$EMSDK_VERSION" "${{ matrix.opt }}" > "$OUT/mame2003_plus_next.json"
          (cd "$OUT" && sha256sum * | tee SHA256SUMS)
          for f in "$OUT"/*.data; do echo "::notice title=core ${{ matrix.opt }}::$(basename "$f") $(du -h "$f" | cut -f1) sha512-$(openssl dgst -sha512 -binary "$f" | base64 -w0)"; done
      - uses: actions/upload-artifact@v6
        with:
          name: mame2003_plus_next-${{ matrix.opt }}
          path: out/${{ matrix.opt }}

  publish:
    name: Publish
    needs: mame2003_plus_next
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: built
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # One release per run: files a build pins (by sha512) are never replaced.
          TAG="core-mame2003_plus_next-${MAME2003_PLUS_COMMIT::8}-r${GITHUB_RUN_NUMBER}"
          mkdir assets
          for dir in built/*; do
            opt="${dir##*-}"
            for f in "$dir"/*; do cp "$f" "assets/${opt}-$(basename "$f")"; done
          done
          ls -la assets
          NOTES="MAME 2003-Plus ${MAME2003_PLUS_COMMIT::8} (libretro/mame2003-plus-libretro) · EmulatorJS/RetroArch ${RETROARCH_COMMIT::9} · emsdk $EMSDK_VERSION · built ${GITHUB_SHA::7}. O2 = the core's release flags; other prefixes are measurement builds (prof = function names kept). GPL-2.0-or-later; source: $MAME2003_PLUS_REPO at the commit above."
          gh release create "$TAG" --prerelease --title "MAME 2003-Plus (2026) for RetroPlay · run ${GITHUB_RUN_NUMBER}" --notes "$NOTES" --target "$GITHUB_SHA" assets/*
          echo "::notice title=core release::$TAG"
