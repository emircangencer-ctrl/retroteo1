<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0C0F">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Yerel retro oyun kütüphanen: NES, Super Nintendo, Mega Drive ve arcade. Çevrimdışı çalışır, oyunların cihazında kalır.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <title>RetroPlay</title>
  <style>
    html, body { margin: 0; background: #0B0C0F; color: #F2F3F5; }
    .boot { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; font: 800 18px/1 system-ui, sans-serif; letter-spacing: 0.12em; }
    .boot span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 10px; border-radius: 2px; background: #FF5B2E; box-shadow: 0 0 12px #FF5B2E; }
  </style>
</head>
<body>
  <div id="app"><div class="boot"><span>RETROPLAY</span><noscript>RetroPlay için JavaScript gerekir.</noscript></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
